name: 🔎 PR Quality Checks

on:
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════
  #  JOB 1 — Lint & Type Check
  # ════════════════════════════════════════════════════════════
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install server dependencies
        run: npm ci --prefer-offline

      - name: Install client dependencies
        run: cd client && npm ci --prefer-offline

      - name: Lint server code
        run: npm run lint --if-present || echo "::warning::No lint script found for server"

      - name: Lint client code
        run: cd client && npm run lint --if-present || echo "::warning::No lint script found for client"

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — Build Check
  # ════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install all dependencies
        run: |
          npm ci --prefer-offline
          cd client && npm ci --prefer-offline

      - name: Build client
        run: cd client && npm run build --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build-pr-${{ github.event.pull_request.number }}
          path: client/build/
          retention-days: 3

  # ════════════════════════════════════════════════════════════
  #  JOB 3 — Security Audit
  # ════════════════════════════════════════════════════════════
  security:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Audit server dependencies
        run: npm audit --audit-level=high || echo "::warning::Server audit found issues — review before merging"

      - name: Audit client dependencies
        run: cd client && npm audit --audit-level=high || echo "::warning::Client audit found issues — review before merging"

  # ════════════════════════════════════════════════════════════
  #  JOB 4 — PR Summary
  # ════════════════════════════════════════════════════════════
  pr-summary:
    name: 📋 PR Summary
    runs-on: ubuntu-latest
    needs: [lint, build, security]
    if: always()
    steps:
      - name: Write PR check summary
        run: |
          echo "## 🔎 PR Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY